name: Build RAPID-SIS Windows installer

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-installer-win:
    name: Windows Installer with constructor
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v5
    - uses: anaconda/actions/setup-anaconda-cli@v0.3.1
      id: setup-anaconda-cli
      with:
        version: latest
        tools: anaconda-cli, pixi
    - uses: conda-incubator/setup-miniconda@v4
      with:
        activate-environment: ""
        channels: conda-forge,defaults
        miniconda-version: "latest"
        mamba-version: "*"
    - name: Bash 1
      shell: bash -el {0}
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
      run: |
        mkdir bld
        mamba install constructor conda-build anaconda-client -c conda-forge
        conda build . --output-folder ./bld
        anaconda --verbose --token "$ANACONDA_API_TOKEN" upload --user "earthquaker" ./bld/**/*.conda
        constructor . --output-dir RAPID_SIS_Win_x64
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: RAPID_SIS
        path: RAPID_SIS_Win_x64/
    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
          files: |
            RAPID_SIS_Win_x64/*.exe
            LICENSE
